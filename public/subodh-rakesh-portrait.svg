<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCEEFF"/>
      <stop offset="50%" stop-color="#E5E7FF"/>
      <stop offset="100%" stop-color="#FFF0EB"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF683D"/>
      <stop offset="100%" stop-color="#E55328"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="450" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Decorative Ring -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="#FF683D" stroke-width="3" stroke-dasharray="10 8" opacity="0.45"/>
  <circle cx="200" cy="180" r="115" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Leader Portrait Silhouette Artwork -->
  <!-- Kurta / Attire -->
  <path d="M 120 380 Q 200 320 280 380 L 290 450 L 110 450 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Nehru Jacket / Coat -->
  <path d="M 140 370 Q 200 340 260 370 L 270 450 L 130 450 Z" fill="url(#suitGrad)"/>
  <!-- Orange Shawl / Lapel -->
  <path d="M 175 350 L 195 450 L 205 450 L 225 350 Z" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Neck & Face -->
  <rect x="180" y="220" width="40" height="40" rx="10" fill="#E2B191"/>
  <ellipse cx="200" cy="180" rx="55" ry="68" fill="#F0C3A5"/>
  
  <!-- Hair & Styling -->
  <path d="M 142 165 Q 160 115 200 115 Q 240 115 258 165 Q 255 130 200 125 Q 150 130 142 165 Z" fill="#1F2937"/>

  <!-- Facial Features -->
  <!-- Eyebrows -->
  <path d="M 165 160 Q 178 156 188 160" stroke="#1F2937" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 212 160 Q 222 156 235 160" stroke="#1F2937" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="178" cy="172" r="4.5" fill="#1F2937"/>
  <circle cx="222" cy="172" r="4.5" fill="#1F2937"/>

  <!-- Glasses (Leader Style) -->
  <rect x="160" y="162" width="34" height="22" rx="6" fill="none" stroke="#334155" stroke-width="2.5"/>
  <rect x="206" y="162" width="34" height="22" rx="6" fill="none" stroke="#334155" stroke-width="2.5"/>
  <line x1="194" y1="172" x2="206" y2="172" stroke="#334155" stroke-width="2.5"/>

  <!-- Smile / Expression -->
  <path d="M 186 215 Q 200 225 214 215" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Decorative Badge at Bottom -->
  <g transform="translate(100, 395)">
    <rect width="200" height="42" rx="21" fill="#172033" filter="url(#shadow)"/>
    <rect x="2" y="2" width="196" height="38" rx="19" fill="#172033" stroke="#FF683D" stroke-width="1.5"/>
    <text x="100" y="26" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif">सुबोध राकेश</text>
  </g>
</svg>
